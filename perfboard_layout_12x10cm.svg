<path d="M235 520 C250 410 250 330 235 280" class="power"/><text x="245" y="420" class="text">5V lojik</text>
<path d="M215 520 C210 430 210 340 215 280" class="gnd"/><text x="165" y="415" class="text">GND</text>
<text x="90" y="825" class="text">Kural: Güç hatlarını kalın, sinyal hatlarını kısa ve çaprazsız tut. Motor kablolarını IMU kablolarından uzak geçir.</text>
