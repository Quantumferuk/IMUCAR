<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<style>
 .grid{stroke:#cbd5e1;stroke-width:1}
 .box{fill:#f8fafc;stroke:#0f172a;stroke-width:2;rx:12;ry:12}
 .module{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:10;ry:10}
 .power{stroke:#dc2626;stroke-width:5;fill:none}
 .gnd{stroke:#475569;stroke-width:5;fill:none}
 .sig{stroke:#16a34a;stroke-width:3;fill:none;stroke-dasharray:8 6}
 .text{font-family:Arial,sans-serif;font-size:16px;fill:#0f172a}
 .title{font-family:Arial,sans-serif;font-size:24px;font-weight:bold;fill:#0f172a}
</style>
<text x="40" y="45" class="title">12x10 cm Delikli Pertinaks Yerleşim Taslağı</text>
<rect x="60" y="80" width="1080" height="760" class="box"/>
